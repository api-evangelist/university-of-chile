    summary: >-
      The University of Chile has no single branded developer portal or
      self-service API program with keys. Its confirmed machine-readable
      footprint is open scholarly infrastructure. The Dataverse research
      data repository was verified live: GET /api/info/version returned
      {"status":"OK","version":"5.13"}, confirming the standard Dataverse
      REST/Search API. The DSpace institutional repository's OAI-PMH base
      URL is documented in OpenDOAR/ROAR but probes returned HTTP 503 at
      review time, so it is cataloged as documented-but-unconfirmed. Two
      official GitHub orgs (eol-uchile, open-uchile) host Open edX forks,
      not a public API. No endpoints were fabricated; only directly
      observed or registry-documented properties are recorded.
