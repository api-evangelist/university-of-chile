apis:
- aid: university-of-chile:datos-dataverse-api
  name: UChile Research Data Repository API (Dataverse)
  description: >-
    The University of Chile self-hosts a Dataverse installation at datos.uchile.cl on its own network (200.89.78.15,
    the same /16 as uchile.cl), administered from repositoriodedatos@uchile.cl. The REST API is open and unauthenticated
    for read: GET /api/info/version returned 200 with {version 5.13, build 1244-79d6e57} and GET /api/search?q=*&type=dataset
    returned 200 with 156 datasets on 2026-09-01. The host also serves its own generated OpenAPI at /openapi (200,
    280,980 bytes) — but that document is the Dataverse product contract, titled "Deployed Resources" with internal
    default-server hostnames, identical to every Dataverse 5.13 deployment. It is NOT UChile's engineering and is
    deliberately not carried in this repo; a rebranded copy of it was removed on 2026-09-01. The endpoint is UChile's,
    the contract is IQSS's.
  humanURL: https://datos.uchile.cl/
  baseURL: https://datos.uchile.cl/api
