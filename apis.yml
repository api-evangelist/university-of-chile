x-coverage:
  state: covered
  reason: covered
  detail: >-
    Five institution-operated machine surfaces were found and verified live on 2026-09-01 — a Dataverse 5.13 REST
    API and OAI-PMH provider on datos.uchile.cl, a DSpace 6 REST API and OAI-PMH provider on repositorio.uchile.cl,
    and an authenticated JSON API on U-Campus (ucampus.uchile.cl/api) — plus three registry memberships evidenced
    from the registries' own APIs (DataCite UCHILE / UCHILE.DATAVERSE / prefix 10.34691, Crossref member 3330 /
    prefix 10.5354, ROR 047gc3g35). Two vendor platforms are recorded as tenant relationships rather than UChile
    contracts: Ex Libris Primo VE (catalogo.uchile.cl, 56UDC_INST) and U-Cursos on u-cursos.cl. THE MAJOR CORRECTION:
    this repo previously carried 24 OpenAPIs titled "UChile Research Data Repository (Dataverse API) …", split by
    tag from one document, plus 49 collections, 4 JSON Schemas titled "Dataverse Dataset/DataFile/Collection", 2
    JSON Structures, 2 Spectral rulesets and an agentic-access profile claiming 419 operations. All of it derives
    from one Dataverse product contract that the June 2026 pass captured from datos.uchile.cl/openapi and rebranded
    with a UChile title — the live document is titled "Deployed Resources" and is identical to every Dataverse 5.13
    deployment. The host-based audit could not see this because our own rebranding defeated the shared-title check.
    84 files were removed; the deployment is kept as an institution-operated surface with probe evidence and no
    contract. No identity federation exists to record: UChile publishes no entity in the eduGAIN aggregate (10,615
    entities searched, zero uchile matches) and Chile's COFRe federation carries no uchile.cl IdP. api.uchile.cl
    resolves to 200.89.77.21 but answers nothing on 80 or 443. No developer portal, no llms.txt, no security.txt,
    and the Dataverse install states it has no API terms of use.
