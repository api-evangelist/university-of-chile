aid: university-of-chile
name: University of Chile
x-type: university
x-category: Public Research University
description: >-
  The University of Chile (Universidad de Chile, UChile) is the country's oldest public university, founded in 1842
  in Santiago, and Chile's largest research institution (ROR 047gc3g35, domain uchile.cl). Its programmable footprint
  is entirely scholarly infrastructure and is real but SMALL: the institution self-hosts a Dataverse research data
  repository at datos.uchile.cl (Dataverse 5.13, build 1244-79d6e57, administered from repositoriodedatos@uchile.cl)
  and a DSpace institutional repository at repositorio.uchile.cl, and both answer machine calls today — a Dataverse
  REST API and OAI-PMH provider on the first, a DSpace 6 REST API and OAI-PMH provider on the second. It also runs
  U-Campus (ucampus.uchile.cl), the academic-management platform built in-house at the Facultad de Ciencias Físicas
  y Matemáticas, whose /api/ path answers with structured JSON but is authenticated and undocumented. What UChile
  does NOT have is engineering of its own behind any of it: every contract on those hosts is the product's, generated
  by Dataverse or DSpace and identical to every other deployment of that software, so no OpenAPI is carried in this
  repo. There is no central developer portal, no self-service key issuance, no published API terms of use (the Dataverse
  install answers apiTermsOfUse with "There are no API Terms of Use"), no llms.txt and no security.txt. The institution
  is a registrant rather than a publisher: a DataCite member (UCHILE) and repository client (UCHILE.DATAVERSE, prefix
  10.34691, 5,709 DOIs) and a Crossref member (id 3330, prefix 10.5354, 2,330 current DOIs). Library discovery runs
  on Ex Libris Primo VE (catalogo.uchile.cl, institution code 56UDC_INST) as a tenant, not as a UChile contract.
  No UChile Shibboleth or SAML identity provider is published in the eduGAIN metadata aggregate, and Chile's COFRe
  federation carries no uchile.cl entity — the one strong institution-operated identity surface most universities
  have is absent here.
