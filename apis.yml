---
aid: university-of-chile
name: University of Chile
description: >-
  The University of Chile (Universidad de Chile, UChile) is the country's
  oldest public university, founded in 1842 in Santiago, and is ranked #139
  in the QS World University Rankings 2025. Its public, machine-readable
  footprint is centered on research and scholarly infrastructure rather than
  a single branded developer portal: a Dataverse-based research data
  repository (datos.uchile.cl) that exposes the standard Dataverse REST API,
  and a DSpace institutional repository (repositorio.uchile.cl) that exposes
  an OAI-PMH interface for metadata harvesting. The university also maintains
  official open-source GitHub organizations for its Open edX online-education
  platform. No general-purpose, self-service developer program with API keys
  was confirmed; access is via open standards and open data.
