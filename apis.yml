- aid: university-of-chile:ucursos-api
  name: U-Cursos API
  description: >-
    U-Cursos is the course-management platform used across University of Chile faculties, built on the same U-Campus
    codebase and now productised by Centro Tecnológico Ucampus (ucampus.cl) for other Chilean universities. It runs
    on u-cursos.cl, NOT under the uchile.cl registrable domain, so it is recorded as a tenant relationship rather
    than a UChile contract. The API answers: GET https://www.u-cursos.cl/api/ returned 400 {"error":"Versión de
