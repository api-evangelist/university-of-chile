- aid: university-of-chile:datacite-membership
  name: DataCite membership and repository registration
  description: >-
    The University of Chile is a DataCite member, not a DataCite operator. Evidenced 2026-09-01 from the DataCite
    REST API: provider UCHILE (memberType consortium, rorId https://ror.org/047gc3g35, country CL), consortium organization
    VWYS, and repository client UCHILE.DATAVERSE — "Repositorio de Datos de Investigación de la Universidad de Chile",
    registered 2019, url https://datos.uchile.cl/. Prefix 10.34691 resolves to that client and carries 5,709 DOIs.
    This is a fact about UChile, recorded as a membership; the DataCite API contract belongs to DataCite and is
    not saved here.
