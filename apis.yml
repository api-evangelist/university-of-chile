- aid: university-of-chile:ucampus-api
  name: U-Campus Academic Management API
  description: >-
    U-Campus is the University of Chile's own academic and curricular management platform, built in-house by the
    Área de Infotecnologías of the Facultad de Ciencias Físicas y Matemáticas and extended across the university.
    Its /api/ path is a live JSON surface on the institution's own host: GET /api/ returns 400 {"error":"Falta la
    versión de la API"} and GET /api/2/ returns a JSON 404 — a versioned router that answers, not a 404 page. No
    resource path resolved unauthenticated and no public reference, OpenAPI or developer documentation exists anywhere
    on ucampus.uchile.cl. This is the closest thing UChile has to a course-catalog / registrar API and it is entirely
    closed. No contract is generated to stand in for one.
  humanURL: https://ucampus.uchile.cl/
  baseURL: https://ucampus.uchile.cl/api
  x-operator: institution
  tags:
  - Course Catalog
