- aid: university-of-chile:repositorio-oai-pmh
  name: Repositorio Academico OAI-PMH
  description: >-
    The University of Chile institutional repository (Repositorio Academico), managed by SISIB and built
    on DSpace, exposes an OAI-PMH 2.0 interface for harvesting Dublin Core / metadata records of theses,
    articles, books and other scholarly outputs. The OAI base URL is registered in OpenDOAR/ROAR. Probes
    returned an intermittent HTTP 503 at review time; the endpoint is documented but was not confirmed
    live during this review.
